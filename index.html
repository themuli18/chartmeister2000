<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sensory Map — nerve response recording</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=Spline+Sans+Mono:wght@300..600&display=swap" rel="stylesheet">

<style>
/* ============================================================
   SENSORY MAP
   Design rule: the only saturated colour in this interface is a
   measurement. All chrome is achromatic; hue appears exclusively
   where a response has been recorded.
   ============================================================ */

:root {
  /* Grounds — darkfield viewport, enamel instrument panels */
  --field:      #101619;
  --field-deep: #0A0F11;
  --enamel:     #DDE3E0;
  --enamel-lo:  #CDD5D2;
  --ink:        #12191C;
  --ink-mid:    #55635F;
  --ink-low:    #7C8884;
  --bone:       #EAF0F2;

  --rule:       rgba(18, 25, 28, 0.16);
  --rule-hard:  rgba(18, 25, 28, 0.38);
  --rule-dark:  rgba(234, 240, 242, 0.14);

  --panel-w:    306px;
  --shadow:     0 18px 44px rgba(0,0,0,0.55), 0 2px 6px rgba(0,0,0,0.4);

  --ui:   'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'Spline Sans Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--field);
  background-image: radial-gradient(ellipse 62% 68% at 50% 47%,
                    #182126 0%, #0F1518 62%, #080C0E 100%);
  color: var(--bone);
  font-family: var(--ui);
  -webkit-font-smoothing: antialiased;
}

/* Focus is expressed achromatically — never with a colour, which
   would read as a recorded value. */
:focus-visible {
  outline: 2px solid var(--bone);
  outline-offset: 2px;
}
.sp-panel :focus-visible,
.sp-card  :focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

/* ---------- Viewport layers ---------------------------------- */

#webgl-container,
#css-container {
  position: absolute;
  inset: 0;
  width: 100vw;
  height: 100vh;
}
#webgl-container { z-index: 1; }
#css-container   { z-index: 2; pointer-events: none; }

/* ---------- Top rail ----------------------------------------- */

.sp-rail {
  position: absolute;
  top: 0; left: 0; right: 0;
  z-index: 12;
  display: grid;
  /* minmax(0,1fr) lets the middle column drop below its min-content
     width, which is what actually lets the hint wrap. */
  grid-template-columns: auto minmax(0, 1fr) auto;
  grid-template-areas:
    "mark word  tally"
    "mark hint  tally";
  column-gap: 16px;
  align-items: start;
  padding: 18px 22px 20px;
  pointer-events: none;
  background: linear-gradient(to bottom, rgba(10,15,17,0.88) 0%, rgba(10,15,17,0.0) 100%);
}

/* The identity mark is the instrument in miniature — and doubles
   as the legend for the marker colours on the model. */
.sp-mark { grid-area: mark; padding-top: 3px; }

.sp-mark-bars {
  display: flex;
  gap: 1px;
  height: 22px;
  align-items: flex-end;
}
.sp-mark-bars i {
  display: block;
  width: 4px;
  border-radius: 0.5px;
}

.sp-mark-scale {
  display: flex;
  justify-content: space-between;
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 400;
  letter-spacing: 0.06em;
  color: var(--ink-low);
  margin-top: 5px;
}

.sp-wordmark {
  grid-area: word;
  margin: 0;
  font-size: 17px;
  font-weight: 800;
  font-variation-settings: 'wdth' 118;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--bone);
  line-height: 1.1;
}

.sp-hint {
  grid-area: hint;
  margin: 7px 0 0;
  font-family: var(--mono);
  font-size: 11.5px;
  font-weight: 300;
  letter-spacing: 0.01em;
  color: var(--ink-low);
}
.sp-hint b {
  font-weight: 500;
  color: #9AA6A2;
}
/* Each instruction stays whole; the line breaks only between them */
.sp-hint span { white-space: nowrap; margin-right: 0.7em; }

/* Name the gesture the device actually has. Both rules carry the same
   specificity, so the media query wins by order — not by accident. */
.sp-hint .sp-coarse { display: none; }
@media (pointer: coarse) {
  .sp-hint .sp-fine   { display: none; }
  .sp-hint .sp-coarse { display: inline; }
}

.sp-tally {
  grid-area: tally;
  justify-self: end;
  text-align: right;
  pointer-events: none;
}
.sp-tally-n {
  display: block;
  font-size: 30px;
  font-weight: 700;
  font-variation-settings: 'wdth' 112;
  line-height: 0.9;
  color: var(--bone);
  font-variant-numeric: tabular-nums;
}
.sp-tally-l {
  display: block;
  margin-top: 5px;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-low);
}

/* ---------- Findings panel ----------------------------------- */

.sp-panel {
  position: absolute;
  top: 104px;
  right: 22px;
  z-index: 11;
  width: var(--panel-w);
  max-height: calc(100vh - 148px);
  display: none;            /* → flex once a finding exists */
  flex-direction: column;
  background: var(--enamel);
  color: var(--ink);
  border-radius: 3px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.sp-panel.is-open { display: flex; }

.sp-panel-head {
  flex: 0 0 auto;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 13px 15px 11px;
  border-bottom: 1px solid var(--rule-hard);
}
.sp-panel-title {
  margin: 0;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.17em;
  text-transform: uppercase;
  font-variation-settings: 'wdth' 108;
}
.sp-panel-sub {
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 400;
  letter-spacing: 0.08em;
  color: var(--ink-mid);
}

.sp-list {
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 4px 0 6px;
}

.sp-row {
  display: grid;
  grid-template-columns: 1fr 22px;
  align-items: center;
  gap: 8px;
  padding: 0 15px;
  border-bottom: 1px solid var(--rule);
}
.sp-list .sp-row:last-child { border-bottom: 0; }
.sp-row:hover { background: var(--enamel-lo); }

.sp-row-main {
  display: grid;
  grid-template-columns: 34px 1fr;
  align-items: start;
  gap: 11px;
  width: 100%;
  padding: 9px 0;
  border: 0;
  background: transparent;
  text-align: left;
  font: inherit;
  color: inherit;
  cursor: pointer;
}

.sp-row-val {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 34px;
  border-radius: 2px;
  font-size: 17px;
  font-weight: 800;
  font-variation-settings: 'wdth' 100;
  font-variant-numeric: tabular-nums;
  box-shadow: inset 0 0 0 1px rgba(18,25,28,0.22);
}

/* These are spans inside a button, so each must be told to stack. */
.sp-row-body { display: block; min-width: 0; padding-top: 1px; }

.sp-row-site {
  display: block;
  font-family: var(--mono);
  font-size: 11.5px;
  font-weight: 500;
  letter-spacing: 0.01em;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sp-row-idx {
  display: block;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0.1em;
  color: var(--ink-mid);
  text-transform: uppercase;
  margin-top: 3px;
}
.sp-row-note {
  display: block;
  font-size: 12.5px;
  line-height: 1.42;
  color: #33413D;
  margin-top: 5px;
  overflow-wrap: anywhere;
}

.sp-row-del {
  align-self: center;
  width: 22px; height: 22px;
  padding: 0;
  border: 0;
  border-radius: 2px;
  background: transparent;
  color: var(--ink-mid);
  font-size: 15px;
  line-height: 1;
  cursor: pointer;
}
.sp-row-del:hover { background: var(--ink); color: var(--enamel); }

/* ---------- Marker anchored on the model --------------------- */

/* CSS2DRenderer writes `transform` on .sp-marker every frame to place it,
   so the badge that scales in must be a separate, inner element. */
.sp-marker {
  position: relative;
  width: 0; height: 0;
  pointer-events: none;   /* must not block raycasting */
}

.sp-marker-dot {
  position: absolute;
  left: -13px; top: -13px;
  width: 26px; height: 26px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  box-shadow: 0 0 0 2px var(--field-deep), 0 2px 10px rgba(0,0,0,0.6);
}
.sp-marker.is-new .sp-marker-dot {
  animation: sp-drop 380ms cubic-bezier(0.2, 0.9, 0.25, 1) both;
}
@keyframes sp-drop {
  0%   { transform: scale(0.3); opacity: 0; }
  60%  { transform: scale(1.12); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}

/* ---------- Record card (anchored in 3D) --------------------- */

.sp-anchor {
  position: relative;
  width: 0; height: 0;
  pointer-events: none;
}
/* Stem tying the card to the point it describes */
.sp-anchor::before {
  content: '';
  position: absolute;
  left: -1px; bottom: 4px;
  width: 1px; height: 30px;
  background: linear-gradient(to top, rgba(221,227,224,0.15), var(--enamel));
}
.sp-anchor.is-below::before {
  bottom: auto;
  top: 4px;
  background: linear-gradient(to bottom, rgba(221,227,224,0.15), var(--enamel));
}
.sp-anchor::after {
  content: '';
  position: absolute;
  left: -3px; bottom: 1px;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--enamel);
}

.sp-card {
  position: absolute;
  bottom: 34px;
  left: 0;
  /* --nudge keeps the card inside the viewport horizontally */
  transform: translateX(calc(-50% + var(--nudge, 0px)));
  width: 340px;
  max-width: calc(100vw - 32px);
  padding: 14px 15px 15px;
  background: var(--enamel);
  color: var(--ink);
  border-radius: 3px;
  box-shadow: var(--shadow);
  pointer-events: auto;
}
.sp-anchor.is-below .sp-card { bottom: auto; top: 34px; }

.sp-card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 11px;
  border-bottom: 1px solid var(--rule-hard);
}
.sp-card-title {
  margin: 0;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.17em;
  text-transform: uppercase;
  font-variation-settings: 'wdth' 108;
}
.sp-card-site {
  display: block;
  margin-top: 5px;
  font-family: var(--mono);
  font-size: 11.5px;
  font-weight: 400;
  color: var(--ink-mid);
  overflow-wrap: anywhere;
}
.sp-card-close {
  flex: 0 0 auto;
  width: 24px; height: 24px;
  margin: -3px -4px 0 0;
  padding: 0;
  border: 0;
  border-radius: 2px;
  background: transparent;
  color: var(--ink-mid);
  font-size: 16px;
  line-height: 1;
  cursor: pointer;
}
.sp-card-close:hover { background: var(--ink); color: var(--enamel); }

/* --- The instrument: readout + 11-rung ladder ---------------- */

.sp-gauge {
  display: flex;
  align-items: flex-end;
  gap: 13px;
  padding: 13px 0 9px;
}

.sp-readout {
  flex: 0 0 auto;
  font-size: 52px;
  font-weight: 800;
  font-variation-settings: 'wdth' 122;
  line-height: 0.82;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  min-width: 74px;
  transition: color 140ms linear;
}

.sp-gauge-label {
  flex: 1 1 auto;
  padding-bottom: 4px;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 400;
  line-height: 1.5;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--ink-mid);
}
.sp-gauge-label b {
  display: block;
  font-weight: 500;
  color: var(--ink);
  letter-spacing: 0.06em;
  text-transform: none;
  font-size: 11.5px;
}

.sp-ladder {
  display: grid;
  grid-template-columns: repeat(11, 1fr);
  gap: 1px;
  background: var(--rule-hard);
  border: 1px solid var(--rule-hard);
  border-radius: 2px;
  overflow: hidden;
}

.sp-rung {
  appearance: none;
  border: 0;
  padding: 0;
  height: 38px;
  background: var(--enamel);
  color: var(--ink-mid);
  font-family: var(--mono);
  font-size: 11.5px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
  transition: background 110ms linear, color 110ms linear;
}
.sp-rung:hover { background: var(--enamel-lo); color: var(--ink); }
.sp-rung.is-set { font-weight: 600; }
.sp-rung:focus-visible { outline-offset: -3px; }

.sp-anchors {
  display: flex;
  justify-content: space-between;
  margin-top: 6px;
  font-family: var(--mono);
  font-size: 9.5px;
  font-weight: 400;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--ink-low);
}
.sp-anchors span:nth-child(2) { text-align: center; }
.sp-anchors span:last-child   { text-align: right; }

/* --- Note + commit ------------------------------------------- */

.sp-field { margin-top: 14px; }

.sp-field-label {
  display: block;
  margin-bottom: 6px;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-mid);
}

.sp-note {
  display: block;
  width: 100%;
  height: 58px;
  padding: 8px 9px;
  background: #F1F5F3;
  border: 1px solid var(--rule-hard);
  border-radius: 2px;
  color: var(--ink);
  font-family: var(--ui);
  font-size: 13px;
  line-height: 1.45;
  resize: none;
}
.sp-note::placeholder { color: var(--ink-low); }
.sp-note:focus { border-color: var(--ink); }

.sp-commit {
  width: 100%;
  margin-top: 11px;
  padding: 11px;
  border: 0;
  border-radius: 2px;
  background: var(--ink);
  color: var(--enamel);
  font-family: var(--ui);
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  font-variation-settings: 'wdth' 106;
  cursor: pointer;
  transition: background 120ms linear;
}
.sp-commit:hover { background: #2C3A36; }

/* ---------- Loading ------------------------------------------ */

.sp-loading {
  position: absolute;
  inset: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: var(--field-deep);
}
.sp-loading[hidden] { display: none; }

.sp-load-card {
  width: 100%;
  max-width: 400px;
  text-align: left;
}

.sp-load-title {
  margin: 0;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.19em;
  text-transform: uppercase;
  font-variation-settings: 'wdth' 116;
  color: var(--bone);
}

.sp-load-status {
  margin: 26px 0 10px;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 300;
  line-height: 1.6;
  color: #9AA6A2;
}
.sp-load-status b { font-weight: 500; color: var(--bone); }
.sp-load-status code {
  font-family: var(--mono);
  color: var(--bone);
}

.sp-track {
  height: 3px;
  background: rgba(234,240,242,0.13);
  border-radius: 2px;
  overflow: hidden;
}
.sp-track-fill {
  height: 100%;
  width: 0%;
  background: var(--bone);
  transition: width 180ms linear;
}

.sp-load-meter {
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 400;
  letter-spacing: 0.08em;
  color: var(--ink-low);
  font-variant-numeric: tabular-nums;
}

.sp-picker { margin-top: 24px; }
.sp-picker[hidden] { display: none; }

.sp-pick-btn {
  display: inline-block;
  padding: 11px 18px;
  border-radius: 2px;
  background: var(--bone);
  color: var(--ink);
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-variation-settings: 'wdth' 106;
  cursor: pointer;
}
.sp-pick-btn:hover { background: #FFFFFF; }
.sp-pick-alt {
  margin: 11px 0 0;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 300;
  color: var(--ink-low);
}

.sp-vh {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* ---------- Narrow screens ----------------------------------- */

@media (max-width: 720px) {
  .sp-rail { padding: 14px 16px 16px; column-gap: 12px; }
  .sp-hint { font-size: 10.5px; line-height: 1.75; }
  .sp-hint span { margin-right: 0.5em; }
  .sp-wordmark { font-size: 15px; }
  .sp-panel {
    top: auto;
    bottom: 0;
    left: 0; right: 0;
    width: auto;
    max-height: 42vh;
    border-radius: 3px 3px 0 0;
  }
  .sp-card { width: min(340px, calc(100vw - 24px)); }
  .sp-readout { font-size: 44px; min-width: 62px; }
  .sp-rung { height: 42px; }
}

/* Phone widths: a single instruction is wider than the column, so stop
   holding them on one line and stack them as a short list instead. */
@media (max-width: 480px) {
  .sp-hint {
    font-size: 10px;
    line-height: 1.6;
  }
  .sp-hint span {
    display: block;
    white-space: normal;
    margin-right: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/"
  }
}
</script>

<body>

<!-- Top rail: mark doubles as the response-colour legend -->
<header class="sp-rail">
  <div class="sp-mark" aria-hidden="true">
    <div class="sp-mark-bars" id="mark-bars"></div>
    <div class="sp-mark-scale"><span>0</span><span>10</span></div>
  </div>

  <h1 class="sp-wordmark">Sensory Map</h1>

  <p class="sp-hint">
    <span><b>Drag</b> to rotate</span>
    <span class="sp-fine"><b>Scroll</b> to zoom</span>
    <span class="sp-coarse"><b>Pinch</b> to zoom</span>
    <span class="sp-fine"><b>Double-click the model</b> to record a response</span>
    <span class="sp-coarse"><b>Double-tap the model</b> to record a response</span>
  </p>

  <div class="sp-tally">
    <span class="sp-tally-n" id="tally-n">0</span>
    <span class="sp-tally-l" id="tally-l">findings</span>
  </div>
</header>

<!-- Findings, ordered by response -->
<section class="sp-panel" id="panel" aria-labelledby="panel-title">
  <div class="sp-panel-head">
    <h2 class="sp-panel-title" id="panel-title">Findings</h2>
    <span class="sp-panel-sub">by response</span>
  </div>
  <div class="sp-list" id="list"></div>
</section>

<div id="webgl-container"></div>
<div id="css-container"></div>

<!-- Loading -->
<div class="sp-loading" id="loading">
  <div class="sp-load-card">
    <h2 class="sp-load-title">Sensory Map</h2>

    <p class="sp-load-status" id="load-status">Preparing the viewer</p>

    <div class="sp-track" id="track">
      <div class="sp-track-fill" id="track-fill"></div>
    </div>
    <div class="sp-load-meter">
      <span id="load-bytes">—</span>
      <span id="load-pct"></span>
    </div>

    <div class="sp-picker" id="picker" hidden>
      <label class="sp-pick-btn" for="model-file">Choose model file</label>
      <input class="sp-vh" id="model-file" type="file"
             accept=".glb,.gltf,model/gltf-binary,model/gltf+json">
      <p class="sp-pick-alt">or drop a .glb / .gltf anywhere on this window</p>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ============================================================
   0. The response scale
   Chroma rises with severity, so a 0 reads as quiet and a 10
   reads as loud. Each step carries its own legible text colour.
   ============================================================ */

const SCALE = [
  { bg: '#5A6E76', fg: '#EAF0F2' },  // 0
  { bg: '#6B7C74', fg: '#EAF0F2' },  // 1
  { bg: '#808A6C', fg: '#12191C' },  // 2
  { bg: '#979762', fg: '#12191C' },  // 3
  { bg: '#AFA254', fg: '#12191C' },  // 4
  { bg: '#C9A227', fg: '#12191C' },  // 5
  { bg: '#CE8A2C', fg: '#12191C' },  // 6
  { bg: '#D17130', fg: '#12191C' },  // 7
  { bg: '#C9552F', fg: '#F4EFE8' },  // 8
  { bg: '#BB362B', fg: '#F4EFE8' },  // 9
  { bg: '#A81426', fg: '#F4EFE8' }   // 10
];

// Clinical anchors for the numeric rating scale
const ANCHOR = (v) =>
  v === 0 ? 'No response' :
  v <= 3  ? 'Mild' :
  v <= 6  ? 'Moderate' :
  v <= 9  ? 'Severe' : 'Worst imaginable';

// Paint the identity mark, which is also the legend for the markers
(function paintMark() {
  const bars = document.getElementById('mark-bars');
  SCALE.forEach((step, i) => {
    const bar = document.createElement('i');
    bar.style.background = step.bg;
    bar.style.height = (9 + i * 1.3) + 'px';
    bars.appendChild(bar);
  });
})();

/* ============================================================
   1. Scene, camera, renderers
   ============================================================ */

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x101619, 0.03);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 1.5, 4);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
document.getElementById('webgl-container').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0px';
document.getElementById('css-container').appendChild(labelRenderer.domElement);

/* Darkfield lighting — cool key, faint cool fill, no coloured rim
   (a coloured rim would compete with the response scale). */
scene.add(new THREE.AmbientLight(0xffffff, 0.5));

const keyLight = new THREE.DirectionalLight(0xE6F0F2, 1.45);
keyLight.position.set(5, 10, 7);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x8FA3AB, 0.7);
fillLight.position.set(-5, -5, -7);
scene.add(fillLight);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 1, 0);

/* ============================================================
   2. Model loading
   ============================================================ */

let model = null;
const loader = new GLTFLoader();

const loadingEl  = document.getElementById('loading');
const statusEl   = document.getElementById('load-status');
const pickerEl   = document.getElementById('picker');
const trackEl    = document.getElementById('track');
const fillEl     = document.getElementById('track-fill');
const bytesEl    = document.getElementById('load-bytes');
const pctEl      = document.getElementById('load-pct');

function setupModel(gltf) {
  model = gltf.scene;

  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  model.position.sub(center);

  // Fit the camera to the model regardless of its native scale
  const maxDim = Math.max(size.x, size.y, size.z);
  const fitDist = (maxDim / 2) / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  camera.position.set(0, 0, fitDist * 1.6);
  camera.near = maxDim / 100;
  camera.far = fitDist * 100;
  camera.updateProjectionMatrix();
  controls.target.set(0, 0, 0);
  controls.minDistance = maxDim * 0.2;
  controls.maxDistance = fitDist * 8;
  controls.update();

  // Scale exponential fog to the model so it doesn't swallow large ones
  scene.fog.density = 0.6 / (fitDist * 1.6);

  model.traverse((child) => {
    if (child.isMesh) {
      child.material.transparent = true;
      child.material.opacity = 0.94;
      child.material.emissive = new THREE.Color(0x1B2A30);
      child.material.emissiveIntensity = 0.35;
    }
  });

  scene.add(model);
  loadingEl.hidden = true;
}

// Fall back to manual selection (file:// blocks local fetches)
function showPicker(message) {
  statusEl.innerHTML = message;
  trackEl.hidden = true;
  bytesEl.textContent = '';
  pctEl.textContent = '';
  pickerEl.hidden = false;
}

function loadFromUrl(url) {
  statusEl.innerHTML = 'Loading anatomical model';
  bytesEl.textContent = 'nervous_system.glb';

  loader.load(
    url,
    setupModel,
    // The model is large — report determinate progress rather than sitting silent
    (event) => {
      const mb = (event.loaded / 1048576).toFixed(1);
      if (event.total) {
        const total = (event.total / 1048576).toFixed(1);
        const pct = Math.round((event.loaded / event.total) * 100);
        fillEl.style.width = pct + '%';
        bytesEl.textContent = mb + ' of ' + total + ' MB';
        pctEl.textContent = pct + '%';
      } else {
        bytesEl.textContent = mb + ' MB';
      }
    },
    (error) => {
      console.warn('Auto-load failed; offering manual selection.', error);
      const hint = location.protocol === 'file:'
        ? 'Browsers block local file reads over <code>file://</code>. Run <code>python3 -m http.server</code> in this folder, or choose the file below.'
        : 'Check that the file sits beside this page, or choose it below.';
      showPicker('<b>Couldn’t load nervous_system.glb.</b><br>' + hint);
    }
  );
}

function loadFromFile(file) {
  pickerEl.hidden = true;
  trackEl.hidden = false;
  loadingEl.hidden = false;
  statusEl.textContent = 'Reading the file';
  bytesEl.textContent = file.name;
  pctEl.textContent = '';
  fillEl.style.width = '100%';

  file.arrayBuffer().then((buf) => {
    loader.parse(buf, '', setupModel, (error) => {
      console.error('Failed to parse selected model.', error);
      showPicker('<b>That file isn’t readable as glTF.</b><br>Choose a .glb or .gltf file.');
    });
  }).catch((error) => {
    console.error('Failed to read selected file.', error);
    showPicker('<b>Couldn’t read that file.</b><br>Choose it again.');
  });
}

document.getElementById('model-file').addEventListener('change', (e) => {
  if (e.target.files && e.target.files[0]) loadFromFile(e.target.files[0]);
});

window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => {
  e.preventDefault();
  const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (file) loadFromFile(file);
});

// Always try the bundled model first; the picker is only a fallback.
loadFromUrl('nervous_system.glb');

/* ============================================================
   3. Findings store
   ============================================================ */

const STORAGE_KEY = 'nsv_points_v1';
let points = [];            // { id, n, name, x, y, z, intensity, note }
let nextN = 1;
const markers = new Map();  // id -> CSS2DObject

const panelEl = document.getElementById('panel');
const listEl  = document.getElementById('list');
const tallyEl = document.getElementById('tally-n');
const tallyLabelEl = document.getElementById('tally-l');

function loadPoints() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    points = raw ? (JSON.parse(raw) || []) : [];
  } catch (e) {
    points = [];
  }
  nextN = points.reduce((m, p) => Math.max(m, p.n), 0) + 1;
}

function savePoints() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(points)); } catch (e) {}
}

/* The marker carries its response colour, so the model itself
   reads as the chart. */
function addMarker(p, isNew) {
  const step = SCALE[p.intensity];
  const el = document.createElement('div');
  el.className = 'sp-marker' + (isNew ? ' is-new' : '');

  const dot = document.createElement('span');
  dot.className = 'sp-marker-dot';
  dot.textContent = p.n;
  dot.style.background = step.bg;
  dot.style.color = step.fg;
  el.appendChild(dot);

  const obj = new CSS2DObject(el);
  obj.position.set(p.x, p.y, p.z);
  scene.add(obj);
  markers.set(p.id, obj);
}

function removeMarker(id) {
  const obj = markers.get(id);
  if (obj) { scene.remove(obj); markers.delete(id); }
}

function deletePoint(id) {
  removeMarker(id);
  points = points.filter(p => p.id !== id);
  savePoints();
  renderList();
}

function focusPoint(p) {
  controls.target.set(p.x, p.y, p.z);
  controls.update();
}

function renderList() {
  tallyEl.textContent = points.length;
  tallyLabelEl.textContent = points.length === 1 ? 'finding' : 'findings';
  panelEl.classList.toggle('is-open', points.length > 0);
  listEl.innerHTML = '';

  const sorted = [...points].sort((a, b) => b.intensity - a.intensity);

  for (const p of sorted) {
    const step = SCALE[p.intensity];

    // A row is a group: the recall control and the remove control are
    // siblings, never nested.
    const row = document.createElement('div');
    row.className = 'sp-row';

    const main = document.createElement('button');
    main.className = 'sp-row-main';
    main.type = 'button';
    main.setAttribute('aria-label', 'Show point ' + p.n + ' on the model');
    main.onclick = () => focusPoint(p);

    const val = document.createElement('span');
    val.className = 'sp-row-val';
    val.textContent = p.intensity;
    val.style.background = step.bg;
    val.style.color = step.fg;
    main.appendChild(val);

    const body = document.createElement('span');
    body.className = 'sp-row-body';

    const site = document.createElement('span');
    site.className = 'sp-row-site';
    site.textContent = p.name;
    body.appendChild(site);

    const idx = document.createElement('span');
    idx.className = 'sp-row-idx';
    idx.textContent = 'point ' + p.n + ' · ' + ANCHOR(p.intensity);
    body.appendChild(idx);

    if (p.note) {
      const note = document.createElement('span');
      note.className = 'sp-row-note';
      note.textContent = p.note;
      body.appendChild(note);
    }

    main.appendChild(body);
    row.appendChild(main);

    const del = document.createElement('button');
    del.className = 'sp-row-del';
    del.type = 'button';
    del.innerHTML = '&times;';
    del.title = 'Remove point ' + p.n;
    del.setAttribute('aria-label', 'Remove point ' + p.n);
    del.onclick = () => deletePoint(p.id);
    row.appendChild(del);

    listEl.appendChild(row);
  }
}

/* ============================================================
   4. Recording a response
   ============================================================ */

let openCard = null;   // one record card at a time

function closeCard() {
  if (!openCard) return;
  scene.remove(openCard.obj);
  openCard.anchor.remove();
  openCard = null;
}

function createRecordCard(position, siteName) {
  closeCard();

  const anchor = document.createElement('div');
  anchor.className = 'sp-anchor';

  const card = document.createElement('div');
  card.className = 'sp-card';
  anchor.appendChild(card);

  // --- head
  const head = document.createElement('div');
  head.className = 'sp-card-head';

  const heading = document.createElement('div');
  const title = document.createElement('h3');
  title.className = 'sp-card-title';
  title.textContent = 'Record response';
  const site = document.createElement('span');
  site.className = 'sp-card-site';
  site.textContent = siteName;
  heading.appendChild(title);
  heading.appendChild(site);

  const close = document.createElement('button');
  close.className = 'sp-card-close';
  close.type = 'button';
  close.innerHTML = '&times;';
  close.setAttribute('aria-label', 'Discard this response');
  close.onclick = closeCard;

  head.appendChild(heading);
  head.appendChild(close);
  card.appendChild(head);

  // --- gauge: readout + anchor word
  let value = 5;

  const gauge = document.createElement('div');
  gauge.className = 'sp-gauge';

  const readout = document.createElement('div');
  readout.className = 'sp-readout';

  const gLabel = document.createElement('div');
  gLabel.className = 'sp-gauge-label';
  const gLabelWord = document.createElement('b');
  const gLabelSub = document.createTextNode('reported response');
  gLabel.appendChild(gLabelWord);
  gLabel.appendChild(gLabelSub);

  gauge.appendChild(readout);
  gauge.appendChild(gLabel);
  card.appendChild(gauge);

  // --- the ladder: 11 discrete rungs, a real radio group
  const ladder = document.createElement('div');
  ladder.className = 'sp-ladder';
  ladder.setAttribute('role', 'radiogroup');
  ladder.setAttribute('aria-label', 'Reported response, 0 to 10');

  const rungs = [];

  function setValue(v, moveFocus) {
    value = v;
    const step = SCALE[v];
    readout.textContent = v;
    readout.style.color = step.bg;
    gLabelWord.textContent = ANCHOR(v);

    rungs.forEach((rung, i) => {
      const on = i === v;
      rung.classList.toggle('is-set', on);
      rung.setAttribute('aria-checked', on ? 'true' : 'false');
      rung.tabIndex = on ? 0 : -1;
      rung.style.background = on ? SCALE[i].bg : '';
      rung.style.color = on ? SCALE[i].fg : '';
    });

    if (moveFocus) rungs[v].focus();
  }

  for (let i = 0; i <= 10; i++) {
    const rung = document.createElement('button');
    rung.className = 'sp-rung';
    rung.type = 'button';
    rung.setAttribute('role', 'radio');
    rung.textContent = i;
    rung.onclick = () => setValue(i, false);
    ladder.appendChild(rung);
    rungs.push(rung);
  }

  ladder.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp')   { e.preventDefault(); setValue(Math.min(10, value + 1), true); }
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowDown') { e.preventDefault(); setValue(Math.max(0,  value - 1), true); }
    if (e.key === 'Home')  { e.preventDefault(); setValue(0, true); }
    if (e.key === 'End')   { e.preventDefault(); setValue(10, true); }
  });

  card.appendChild(ladder);

  const anchors = document.createElement('div');
  anchors.className = 'sp-anchors';
  ['none', 'moderate', 'worst imaginable'].forEach((t) => {
    const s = document.createElement('span');
    s.textContent = t;
    anchors.appendChild(s);
  });
  card.appendChild(anchors);

  // --- note
  const field = document.createElement('div');
  field.className = 'sp-field';

  const noteId = 'note-' + nextN;
  const label = document.createElement('label');
  label.className = 'sp-field-label';
  label.setAttribute('for', noteId);
  label.textContent = 'Note (optional)';

  const note = document.createElement('textarea');
  note.className = 'sp-note';
  note.id = noteId;
  note.placeholder = 'sharp, radiating distally';

  field.appendChild(label);
  field.appendChild(note);
  card.appendChild(field);

  // --- commit. The action keeps its name through the flow.
  const commit = document.createElement('button');
  commit.className = 'sp-commit';
  commit.type = 'button';
  commit.textContent = 'Record';
  commit.onclick = () => {
    const p = {
      id: 'p_' + Date.now() + '_' + nextN,
      n: nextN++,
      name: siteName,
      x: position.x, y: position.y, z: position.z,
      intensity: value,
      note: note.value.trim()
    };
    points.push(p);
    addMarker(p, true);
    savePoints();
    renderList();
    closeCard();
  };
  card.appendChild(commit);

  setValue(5, false);

  const obj = new CSS2DObject(anchor);
  obj.position.copy(position);
  scene.add(obj);
  openCard = { obj, anchor, card };
  placeCard();
}

/* The card is anchored to a point that moves as the model rotates, so its
   placement is re-checked each frame: flip below the anchor when there
   isn't room above, and nudge sideways to stay on screen. */
const RAIL_H = 96;
const EDGE = 12;

function placeCard() {
  if (!openCard) return;
  const { anchor, card } = openCard;

  const pt = anchor.getBoundingClientRect();      // 0×0 — this is the point
  const h  = card.offsetHeight;
  const w  = card.offsetWidth;

  const roomAbove = pt.top - RAIL_H - 34;
  anchor.classList.toggle('is-below', roomAbove < h);

  let nudge = 0;
  const left = pt.left - w / 2;
  if (left < EDGE) nudge = EDGE - left;
  else if (left + w > window.innerWidth - EDGE) nudge = window.innerWidth - EDGE - (left + w);
  card.style.setProperty('--nudge', nudge.toFixed(1) + 'px');
}

/* ============================================================
   5. Picking a site on the model
   ============================================================ */

const raycaster = new THREE.Raycaster();
raycaster.params.Line.threshold = 0.05;
raycaster.params.Points.threshold = 0.05;

const mouse = new THREE.Vector2();

/* Double-click, not click: a single pointerdown is how the model is
   dragged to rotate, and every drag would otherwise open a card. */
window.addEventListener('dblclick', (event) => {
  // Ignore double-clicks that land on the chrome
  if (event.target.closest('.sp-card') ||
      event.target.closest('.sp-panel') ||
      event.target.closest('.sp-rail')) return;

  mouse.x =  (event.clientX / window.innerWidth)  * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  if (!model) return;

  const intersects = raycaster.intersectObject(model, true);
  if (intersects.length > 0) {
    const hit = intersects[0];
    createRecordCard(hit.point, hit.object.name || 'Unnamed site');
  }
});

window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeCard();
});

/* ============================================================
   6. Restore, resize, render
   ============================================================ */

loadPoints();
points.forEach((p) => addMarker(p, false));
renderList();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  if (openCard) placeCard();
}

animate();
</script>
</body>
</html>
